; qtquickcontrols2.conf —— Qt Quick Controls 全局样式配置
; 知识点 / 编写原因：
;   Qt Quick Controls 2 在 Windows 上默认使用原生(Windows)样式，
;   该样式不允许自定义 Button.background / Switch.contentItem /
;   TextField.background 等子控件，运行时反复打印
;   "The current style does not support customization of this control"。
;   改为 Basic 样式后，这些自定义才会真正生效，警告也随之消失，
;   同时让整套 HMI 的按钮/输入框保持统一的深蓝工业风格（不同分辨率/平台上外观一致）。
[Controls]
Style=Basic